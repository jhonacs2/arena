<a class="saltar" href="#contenido">Saltar al contenido</a>

<div class="lab">
  <aside class="barra">
    <p class="barra__titulo">Lab</p>
    <p class="barra__sub">Módulo Angular</p>

    <nav aria-label="Sesiones">
      <ol class="sesiones" role="list">
        @for (sesion of sesiones; track sesion.slug) {
          <li>
            @if (sesion.disponible) {
              <a [routerLink]="'/' + sesion.slug" routerLinkActive="activa">
                <span class="sesiones__num">{{ sesion.numero }}</span>
                <span class="sesiones__titulo">{{ sesion.titulo }}</span>
              </a>
            } @else {
              <span class="pendiente" aria-disabled="true">
                <span class="sesiones__num">{{ sesion.numero }}</span>
                <span class="sesiones__titulo">{{ sesion.titulo }}</span>
              </span>
            }
          </li>
        }
      </ol>
    </nav>
  </aside>

  <main id="contenido" class="contenido" tabindex="-1">
    <router-outlet />
  </main>
</div>
