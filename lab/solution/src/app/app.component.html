<a class="skip-link" href="#content">Saltar al contenido</a>

<div class="lab">
  <aside class="sidebar">
    <p class="sidebar__title">Lab</p>
    <p class="sidebar__subtitle">Módulo Angular</p>

    <nav aria-label="Sesiones">
      <ol class="sessions" role="list">
        @for (session of sessions; track session.slug) {
          <li>
            @if (session.available) {
              <a [routerLink]="'/' + session.slug" routerLinkActive="active">
                <span class="sessions__number">{{ session.number }}</span>
                <span class="sessions__title">{{ session.title }}</span>
              </a>
            } @else {
              <span class="locked" aria-disabled="true">
                <span class="sessions__number">{{ session.number }}</span>
                <span class="sessions__title">{{ session.title }}</span>
              </span>
            }
          </li>
        }
      </ol>
    </nav>
  </aside>

  <main id="content" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
