<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 2 874 550" width="874" height="550" role="img">
  <style>
    svg { --dg-surface: #f5f6f0; --dg-surface-raised: #ffffff; --dg-surface-sunken: #ebece4; --dg-text: #08120c; --dg-text-muted: #5b675e; --dg-border: #08120c; --dg-shadow: #08120c; --dg-accent: #cf6f19; --dg-accent-ink: #08120c; --dg-live: #d8151e; --dg-live-ink: #f5f6f0; --dg-success: #137d41; --dg-success-ink: #f5f6f0; --dg-danger: #d8151e; --dg-danger-ink: #f5f6f0; }
    @media (prefers-color-scheme: dark) {
      svg { --dg-surface: #1b1f23; --dg-surface-raised: #2a2e33; --dg-surface-sunken: #05080a; --dg-text: #e1e2da; --dg-text-muted: #a5a59c; --dg-border: #83847b; --dg-shadow: #bebfb5; --dg-accent: #cf6f19; --dg-accent-ink: #08120c; --dg-live: #e06257; --dg-live-ink: #08120c; --dg-success: #419b5f; --dg-success-ink: #08120c; --dg-danger: #e06257; --dg-danger-ink: #08120c; }
    }
  </style>

  <defs>
    <marker id="mk-triangle-end-vardgborder08120c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dg-border, #08120c)" /></marker>
  </defs>
  <rect x="6" y="2" width="874" height="550" fill="var(--dg-surface, #f5f6f0)" />
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="500" fill="var(--dg-text, #08120c)" text-anchor="start" dominant-baseline="central"><tspan x="30" y="36">Los datos bajan. Los avisos suben.</tspan></text>
  <rect x="36" y="76" width="820" height="110" fill="var(--dg-shadow, #08120c)" stroke="var(--dg-shadow, #08120c)" stroke-width="1" />
  <rect x="30" y="70" width="820" height="110" fill="var(--dg-surface-raised, #ffffff)" stroke="var(--dg-border, #08120c)" stroke-width="3" />
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="52" y="94.88">EL PADRE · race-list</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="var(--dg-text, #08120c)" text-anchor="start" dominant-baseline="central"><tspan x="52" y="118.75">RACES  ·  cuál está abierta  ·  qué hacer cuando la tocan</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="52" y="147.5">Tiene el estado y toma las decisiones.</tspan></text>
  <path d="M 210 200 L 210 290" fill="none" stroke="var(--dg-border, #08120c)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk-triangle-end-vardgborder08120c)" />
  <text font-family="'Martian Mono', ui-monospace, 'Cascadia Mono', monospace" font-size="14" font-weight="500" fill="var(--dg-text, #08120c)" text-anchor="start" dominant-baseline="central"><tspan x="228" y="222.75">input()</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="228" y="246.88">baja un dato</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="228" y="264.88">de solo lectura</tspan></text>
  <path d="M 670 290 L 670 200" fill="none" stroke="var(--dg-border, #08120c)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mk-triangle-end-vardgborder08120c)" />
  <text font-family="'Martian Mono', ui-monospace, 'Cascadia Mono', monospace" font-size="14" font-weight="500" fill="var(--dg-accent, #cf6f19)" text-anchor="start" dominant-baseline="central"><tspan x="470" y="222.75">output()</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="470" y="246.88">sube un aviso</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="470" y="264.88">el padre decide</tspan></text>
  <rect x="36" y="306" width="820" height="180" fill="var(--dg-shadow, #08120c)" stroke="var(--dg-shadow, #08120c)" stroke-width="1" />
  <rect x="30" y="300" width="820" height="180" fill="var(--dg-surface-raised, #ffffff)" stroke="var(--dg-border, #08120c)" stroke-width="3" />
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="52" y="324.88">EL HIJO · race-card</tspan></text>
  <text font-family="'Martian Mono', ui-monospace, 'Cascadia Mono', monospace" font-size="14" font-weight="500" fill="var(--dg-text, #08120c)" text-anchor="start" dominant-baseline="central"><tspan x="52" y="348.75">race  ·  time  ·  favourite  ·  selected</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="52" y="375.5">No importa RACES. No sabe cuántas tarjetas hay.</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="52" y="395.5">Por eso se puede usar en cualquier lado.</tspan></text>
  <rect x="500" y="330" width="320" height="120" fill="var(--dg-surface-sunken, #ebece4)" stroke="var(--dg-border, #08120c)" stroke-width="2" stroke-dasharray="8 6" />
  <text font-family="'Martian Mono', ui-monospace, 'Cascadia Mono', monospace" font-size="14" font-weight="500" fill="var(--dg-text, #08120c)" text-anchor="start" dominant-baseline="central"><tspan x="520" y="354.75">ng-content</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="520" y="378.88">un hueco. Lo que el padre</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="520" y="396.88">meta adentro de la etiqueta,</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="520" y="414.88">aparece acá. El hijo no sabe</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" fill="var(--dg-text-muted, #5b675e)" text-anchor="start" dominant-baseline="central"><tspan x="520" y="432.88">qué es ni lo puede leer.</tspan></text>
  <text font-family="'Public Sans', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="500" fill="var(--dg-text, #08120c)" text-anchor="start" dominant-baseline="central"><tspan x="30" y="518.75">El hijo nunca modifica lo que le prestaron. Pide, y el padre decide.</tspan></text>
</svg>
