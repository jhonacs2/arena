# Arena servida por detrás del reverse proxy que ya hay en el VPS.
#
# Este nginx no termina TLS ni escucha en internet: escucha en el 80 de su
# contenedor, que sale a `127.0.0.1` y nada más. El certificado y el 443 los sigue
# manejando el proxy que ya tenés arriba para WorkAdventure.
#
# Hace las dos cosas que hacían falta para no necesitar el túnel ni Pages:
#
#   1. sirve el build de Angular —una carpeta de archivos estáticos—,
#   2. y manda `/api` al backend, **en el mismo origen**.
#
# Lo segundo no es comodidad: la cookie de refresh es `HttpOnly` y de un solo uso.
# Mismo origen anda con `SameSite=Lax` y listo; cruzando dominios haría falta
# `SameSite=None; Secure`, que es justo la cookie que un navegador con bloqueo de
# terceros descarta — y ahí el alumno se desloguea cada 15 minutos en clase.

# `Connection` para el upgrade del WebSocket. Va acá arriba y no adentro del
# `location` porque `map` solo existe en el contexto `http` —este archivo se monta
# en `conf.d/`, que nginx incluye justo ahí—. Traduce: si el pedido trae
# `Upgrade`, la conexión es `upgrade`; si no, se cierra como cualquier HTTP.
# Copiar `$http_connection` a secas rompe el resto del tráfico.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El proxy de adelante ya comprime, pero si algún día no lo hace, que esto no
    # dependa de él: el bundle de Angular sin comprimir se nota en la primera carga.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los logs de acceso se van al stdout del contenedor y de ahí al journal, con
    # el techo que le pone el `logging:` del compose.
    access_log /dev/stdout;
    error_log /dev/stderr;

    # ── La API, en el mismo origen ──────────────────────────────────────────
    #
    # `api` es el nombre del servicio en la red del compose. No hay puerto de por
    # medio en el host: esta conexión no sale del bridge de Docker.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # Sin estas dos, el WebSocket de la sala (`/api/ws`) no llega a abrirse:
        # nginx le contesta 200 a un pedido que esperaba un 101 y el frontend ve
        # una carrera que nunca larga.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El backend pone `Secure` en la cookie de refresh: tiene que saber que
        # afuera esto es https aunque acá adentro sea http plano.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una carrera dura menos que esto, pero el socket de la sala queda abierto
        # mientras el alumno mire la pantalla. Con el default de 60s se corta solo
        # y parece que la app se colgó.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Los `race.tick` van a 10 Hz: si nginx los junta en un búfer, la carrera
        # se ve a los saltos.
        proxy_buffering off;
    }

    # ── El frontend ─────────────────────────────────────────────────────────

    # Los archivos con hash en el nombre no cambian nunca: si cambia el contenido,
    # cambia el nombre. Cachearlos para siempre es seguro y es lo que hace que la
    # segunda visita no descargue nada.
    location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El `index.html`, nunca cacheado. Es el único archivo que apunta a los demás:
    # si el navegador se queda con uno viejo, sigue pidiendo bundles que ya no
    # existen y la app queda rota hasta un recarga forzada que nadie sabe hacer.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular es una SPA con rutas del lado del cliente: `/carreras` no es un
    # archivo. Cualquier ruta que no exista en disco devuelve el index y el router
    # se encarga. Sin esto, recargar la página en cualquier pantalla da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
