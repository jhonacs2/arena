# Arena — entorno local completo: Postgres + el backend.
#
#   cd arena/deploy
#   cp .env.example .env        # y completar JWT_SECRET
#   docker compose up --build
#
# Esto **no** es el despliegue de producción: eso es `docker-compose.prod.yml`,
# que levanta los mismos dos servicios pero con techo de memoria, sin publicar la
# base y con los puertos elegidos para convivir con lo que ya hay en el VPS.
#
# Este compose existe para desarrollar y para probar el esquema contra un Postgres
# descartable antes de tocar el de verdad. La diferencia que más se nota: acá la
# base **sí** publica el 5432 en loopback, para poder abrirle un psql sin rodeos.
#
# Los dos puertos se publican atados a 127.0.0.1. Nada de este proyecto abre un
# puerto de entrada: el tráfico entra por el túnel, que sale desde adentro.

name: arena

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
    ports:
      # Solo para poder abrir un psql desde la máquina. Ni el backend ni nadie
      # más necesita que esto salga del loopback.
      - "127.0.0.1:5432:5432"
    volumes:
      - arena-pgdata:/var/lib/postgresql/data
      # El esquema se aplica al crear el volumen. Es idempotente, así que
      # `docker compose exec -T db psql … -f -` lo puede volver a aplicar cuando
      # cambie, sin borrar nada — eso es justo lo que verifica
      # `node scripts/verify-arena.mjs esquema`.
      - ../docs/contract/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      # El contexto es `arena/`: el Dockerfile necesita `backend/` y
      # `docs/contract/schema.sql`. Ver arena/.dockerignore.
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      # `db` es el nombre del servicio: la resolución la hace la red del compose.
      # En producción es igual, contra el `db` de `docker-compose.prod.yml`.
      #
      # En forma `clave=valor` y no como URL, por el mismo motivo que allá: una
      # contraseña con un `@`, un `/` o un `:` parte la URL donde no va, y el error
      # que sale acusa al puerto. Acá la contraseña suele ser `arena` y no se nota
      # nunca — hasta que alguien copia esta línea al VPS.
      DATABASE_URL: host=db port=5432 user=${POSTGRES_USER:-arena} password=${POSTGRES_PASSWORD:-arena} dbname=${POSTGRES_DB:-arena} sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET, ver .env.example}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-10}
      # Postgres directo, no el pooler: las sentencias preparadas andan bien.
      DB_SIMPLE_PROTOCOL: "false"
      MIGRATE: ${MIGRATE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-instructor}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-instructor}
      # `lax` y no `none`: en local se sirve el frontend con el proxy de `ng serve`
      # (`frontend/proxy.conf.json`), así que `/api` sale por el mismo origen que
      # la app y la petición nunca es cruzada.
      #
      # Y `none` acá sería peor que inútil: el navegador **descarta** una cookie
      # `SameSite=None` que no venga con `Secure`, y en local no hay TLS. La
      # sesión no sobreviviría a recargar la página, sin un solo error en consola.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_SECURE: "false"
    ports:
      # Adentro del contenedor siempre es 8080; afuera manda `API_PORT` porque el
      # 8080 del host lo ocupa cualquier cosa —en la máquina del instructor, NVIDIA
      # Broadcast— y el error de Docker cuando eso pasa no dice quién lo tiene.
      # 8099 es además el default de `scripts/e2e.mjs`.
      - "127.0.0.1:${API_PORT:-8099}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  arena-pgdata:
